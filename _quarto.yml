project:
  type: website
  render:
    - index.md
    - README.md   # README files must be listed explicitly; globs skip them
    - EXAMPLES.md
    - CHANGELOG.md
    - docs/*.md
    # Repo-only documents, deliberately NOT rendered:
    # PUBLISHING.md (root, never globbed) holds maintainer release
    # instructions; SHELL_WRAPPER_DESIGN.md is a design record and
    # docs/CHANGELOG.md a historical feature announcement — they stay
    # repo-only until reviewed for user visibility.
    - "!docs/SHELL_WRAPPER_DESIGN.md"
    - "!docs/CHANGELOG.md"

  # Logo assets referenced by the pages. embed-resources inlines images into
  # each page, but the site favicon/logo/social image are read as files, so
  # ship the image tree.
  resources:
    - docs/images/*.png
    - docs/images/*.svg

# gfm_auto_identifiers makes heading anchors match GitHub's slugs, which the
# docs' cross-links use. Keep pandoc's full markdown reader otherwise —
# `from: gfm` breaks Quarto's navigation divs.
from: markdown+gfm_auto_identifiers

website:
  title: "sharedserver"
  favicon: docs/images/sharedserver-logo.svg
  image: docs/images/sharedserver-logo@2x.png
  search: true
  sidebar:
    style: docked
    logo: docs/images/sharedserver-logo.svg
    tools:
      - icon: github
        href: https://github.com/georgeharker/sharedserver
        text: GitHub repository
    contents:
      - text: "Home"
        href: index.md
      - text: "Overview (README)"
        href: README.md
      - section: "Guides"
        contents:
          - text: "Configuration Examples"
            href: EXAMPLES.md
          - docs/NEOVIM.md
          - docs/OPENCODE.md
          - docs/CLAUDE_CODE.md
          - docs/DEBUGGING.md
      - section: "Reference"
        contents:
          - text: "Changelog"
            href: CHANGELOG.md

format:
  html:
    theme: pulse
    toc: true
    embed-resources: true
